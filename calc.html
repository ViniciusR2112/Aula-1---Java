<html>
<title>Calculadora</title>
<body>
<script>


const display = document.getElementById('display');

// Adiciona números ou operadores ao visor
function appendToDisplay(input) {
    display.value += input;
}

// Limpa todo o visor
function clearDisplay() {
    display.value = "";
}

// Apaga o último caractere digitado
function deleteLast() {
    display.value = display.value.slice(0, -1);
}

// Realiza o cálculo
function calculate() {
    try {
        // eval() processa a string como uma expressão matemática
        display.value = eval(display.value);
    } catch (error) {
        display.value = "Erro";
        setTimeout(clearDisplay, 1500); // Limpa após 1.5s se der erro
    }
}

</script>


<style>

.calculator {
    width: 300px;
    background-color: #202020;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
}

#display {
    width: 100%;
    height: 50px;
    font-size: 24px;
    text-align: right;
    margin-bottom: 10px;
    padding: 10px;
    box-sizing: border-box;
    background: #333;
    color: #fff;
    border: none;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    padding: 20px;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    background-color: #444;
    color: white;
}

button:hover { background-color: #555; }

.operator { background-color: #f39c12; }
.operator:hover { background-color: #e67e22; }

.equals { 
    background-color: #27ae60; 
    grid-row: span 2; 
}

.zero { grid-column: span 2; }

</style>


<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button onclick="clearDisplay()" class="operator">C</button>
        <button onclick="appendToDisplay('/')" class="operator">/</button>
        <button onclick="appendToDisplay('*')" class="operator">×</button>
        <button onclick="deleteLast()" class="operator">DEL</button>
        
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button onclick="appendToDisplay('-')" class="operator">-</button>
        
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button onclick="appendToDisplay('+')" class="operator">+</button>
        
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button onclick="calculate()" class="equals">=</button>
        
        <button onclick="appendToDisplay('0')" class="zero">0</button>
        <button onclick="appendToDisplay('.')">.</button>
    </div>
</div>


</body>
</html>
